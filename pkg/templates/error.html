<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} &mdash; Wakadobe Africa</title>
    <link rel="stylesheet" href="/static/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: #f8f9fa;
        }

        .wd-avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: #0d6efd;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            box-shadow: 0 8px 32px rgba(13, 110, 253, 0.25);
        }

        .wd-avatar span {
            font-size: 3.5rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -2px;
            font-family: Georgia, serif;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 800;
            color: #0d6efd;
            line-height: 1;
            margin-bottom: 0.25rem;
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #0d6efd;
            margin-bottom: 0.75rem;
        }

        .error-message {
            color: #6c757d;
            max-width: 420px;
            margin: 0 auto 2rem;
            line-height: 1.6;
        }

        .btn-home {
            background: #0d6efd;
            color: #fff;
            border: none;
            padding: 0.65rem 2rem;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-home:hover {
            background: #0b5ed7;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="wd-avatar">
            <span>wd</span>
        </div>

        <div class="error-code">{{ code }}</div>
        <div class="error-title">{{ title }}</div>
        <p class="error-message">{{ message }}</p>

        <a href="{{ url_for('wakadobe_index')}}" class="btn-home">Go back home</a>
    </div>
</body>
</html>
