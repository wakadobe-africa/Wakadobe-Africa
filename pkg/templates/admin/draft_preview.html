<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draft Preview - Admin</title>
    <link href="{{ url_for('static', filename='bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(180deg, #edf4fe 0%, #f8fbff 100%);
            color: #1a2a3f;
        }

        .preview-shell {
            max-width: 980px;
            margin: 28px auto;
            border: 1px solid #d7e4f5;
            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 16px 35px rgba(18, 42, 76, 0.10);
            overflow: hidden;
        }

        .preview-head {
            padding: 20px;
            border-bottom: 1px solid #d7e4f5;
            background: #f4f8ff;
        }

        .preview-cover {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
        }

        .preview-content {
            padding: 26px;
        }

        .preview-content img {
            max-width: 100%;
            border-radius: 10px;
            margin: 12px 0;
        }

        .post-meta {
            color: #58708f;
            font-size: 0.94rem;
        }

        .tag-chip {
            display: inline-block;
            border-radius: 999px;
            border: 1px solid #d4e2f4;
            background: #f7fbff;
            color: #36506d;
            padding: 4px 10px;
            font-size: 0.78rem;
            margin-right: 6px;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-2">
        <div class="d-flex justify-content-center">
            <div class="preview-shell w-100">
                <div class="preview-head d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-2">
                    <div>
                        <div class="text-uppercase small fw-semibold text-primary">Draft Preview</div>
                        <h1 class="h4 mb-0">{{ post.title }}</h1>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="{{ url_for('admin_drafts') }}" class="btn btn-outline-secondary btn-sm">Back to Drafts</a>
                        <a href="{{ url_for('create_post', draft_id=post.id) }}" class="btn btn-primary btn-sm">Continue Editing</a>
                    </div>
                </div>

                <img src="{{ post.image }}" alt="{{ post.title }}" class="preview-cover">

                <section class="preview-content">
                    <div class="post-meta mb-3">
                        <span>{{ post.category }}</span> · <span>{{ post.date }}</span> · <span>{{ post.author }}</span>
                    </div>

                    {% if post.excerpt %}
                    <p class="lead">{{ post.excerpt }}</p>
                    {% endif %}

                    {% if post.tags %}
                    <div class="mb-3">
                        {% for tag in post.tags %}
                        <span class="tag-chip">{{ tag }}</span>
                        {% endfor %}
                    </div>
                    {% endif %}

                    <article>
                        {{ post.content_html|safe }}
                    </article>
                </section>
            </div>
        </div>
    </div>
</body>
</html>
