name: Keep Alive

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes — more aggressive
  workflow_dispatch:         # manual trigger

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Send keep-alive request
        run: |
          echo "Pinging server at $(date)"
          curl -v --max-time 60 https://wakadobe-africa.onrender.com/ \
          || echo "Request failed or timed out, but continuing..."
          echo "Ping complete"